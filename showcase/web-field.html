<!doctype html>
<html lang="zh-CN" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlClash Canvas Field · 可交互展示</title>
<link rel="stylesheet" href="../packages/web/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font-sans)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
main{max-width:760px;margin:14vh auto;padding:32px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
h1{font-size:clamp(24px,5vw,40px);line-height:1.2}button{font:inherit;padding:10px 18px;margin:4px;border:1px solid var(--line-strong);border-radius:100px;background:var(--chip);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent)}code{font:14px var(--font-mono);overflow-wrap:anywhere}p{color:var(--ink-2)}
@media(max-width:800px){main{margin:12vh 20px;padding:24px}}
</style>
<canvas aria-hidden="true"></canvas>
<main id="panel">
  <h1>原始 Canvas 胶囊动效</h1>
  <p>从 FlClash 官网源码发现并提取。移动鼠标可唤起附近胶囊；滚动页面会影响速度。保留避让、弹簧伸缩、暂停与明暗配色。</p>
  <button id="pause" aria-pressed="false">暂停</button>
  <button id="theme">切换明暗</button>
  <button id="surge">唤起动效</button>
  <button id="remount">卸载后重新挂载</button>
  <p role="status" id="status">运行中</p>
  <code>const field = mountField(canvas, {avoid, still}); // 卸载时 field?.dispose()</code>
  <p>这是原生 JavaScript Canvas 实现；Flutter 组件需使用各自的原生入口。所有展示在本地运行，无外部请求。</p>
</main>
<script type="module">
import {mountField} from '../packages/web/index.js';
const canvas=document.querySelector('canvas'), panel=document.querySelector('#panel');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=false, field;
const options={avoid:()=>[panel.getBoundingClientRect()],still:()=>paused||reduced.matches};
const status=document.querySelector('#status');
const refresh=()=>{field?.refresh();status.textContent=paused?'已暂停':reduced.matches?'系统减少动效：静止展示':'运行中';};
field=mountField(canvas,options);refresh();
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';document.querySelector('#pause').setAttribute('aria-pressed',String(paused));refresh();};
document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';refresh();};
document.querySelector('#surge').onclick=()=>field?.surge();
document.querySelector('#remount').onclick=()=>{field?.dispose();field=mountField(canvas,options);refresh();status.textContent+=' · 已重新挂载';};
reduced.addEventListener('change',refresh);
addEventListener('pagehide',()=>{field?.dispose();reduced.removeEventListener('change',refresh);},{once:true});
</script>
</html>
